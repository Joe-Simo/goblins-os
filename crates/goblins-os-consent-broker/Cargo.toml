[package]
name = "goblins-os-consent-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
native-desktop = ["dep:goblins-os-ui", "dep:gtk4", "goblins-os-ui/native-desktop"]

[dependencies]
goblins-os-core-client = { path = "../goblins-os-core-client" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblins-os-ui = { path = "../goblins-os-ui", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.9", optional = true }
