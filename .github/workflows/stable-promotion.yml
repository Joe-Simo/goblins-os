                actual="sha256:$(sha256sum "$body" | awk '{print $1}')"
                test "$actual" = "$digest" || {
                  rm -f -- "$token_json" "$headers" "$body"
                  return 1
                }
                rm -f -- "$token_json" "$headers" "$body"
                printf '%s@%s\n' "$repository_ref" "$digest"
