                  raise SystemExit("stable ISO contains an x86-64 EFI bootloader")
              efiboot_members = [
                  member for member in iso_members if member.casefold() == "images/efiboot.img"
              ]
              if len(efiboot_members) != 1:
                  raise SystemExit("stable ISO does not contain one /images/efiboot.img")
              efiboot = extract_one(
                  iso, efiboot_members[0], temporary / "efiboot-extract"
              )
              fat_members = archive_paths(efiboot)
              efi_members = [
                  member for member in fat_members if PurePosixPath(member).suffix.casefold() == ".efi"
              ]
              if not efi_members:
                  raise SystemExit("stable EFI boot image contains no EFI applications")
              if any(PurePosixPath(member).name.casefold() == "bootx64.efi" for member in efi_members):
                  raise SystemExit("stable EFI boot image contains BOOTX64.EFI")
              if sum(
                  PurePosixPath(member).name.casefold() == "bootaa64.efi"
                  for member in efi_members
              ) != 1:
                  raise SystemExit("stable EFI boot image must contain one BOOTAA64.EFI")
              for index, member in enumerate(efi_members):
                  extracted = extract_one(
                      efiboot, member, temporary / f"efi-{index:03d}"
                  )
                  verify_arm64_efi(extracted, member)
          PY

          install -d -m 0700 "$GH_CONFIG_DIR" "$DOCKER_CONFIG"
          printf '%s' "$publication_gh_token" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cleanup_credentials() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -f -- "$DOCKER_CONFIG/config.json" "$GH_CONFIG_DIR/hosts.yml"
            unset publication_gh_token || true
          }
          created_release=0
          transaction_draft_release=0
          release_published=0
          aliases_mutated=0
          release_id=""
          release_marker=""
          previous_aarch64_ref=""
          previous_stable_ref=""
          publication_exit() {
            status=$?
            trap - EXIT HUP INT TERM
            if [ "$status" -ne 0 ]; then
              set +e
              if [ "$aliases_mutated" -eq 1 ]; then
                current_aarch64_ref="$(snapshot_alias ghcr.io/joe-simo/goblins-os:aarch64 2>/dev/null || true)"
                if [ "$current_aarch64_ref" = "ghcr.io/joe-simo/goblins-os@$image_digest" ]; then
                  docker buildx imagetools create \
                    --tag ghcr.io/joe-simo/goblins-os:aarch64 \
                    "$previous_aarch64_ref" >/dev/null \
                    || echo "failed to restore the prior :aarch64 alias" >&2
                else
                  echo "refusing to overwrite a concurrently changed :aarch64 alias" >&2
                fi
                if [ -n "$previous_stable_ref" ]; then
                  current_stable_ref="$(snapshot_alias ghcr.io/joe-simo/goblins-os:stable 2>/dev/null || true)"
                  if [ "$current_stable_ref" = "ghcr.io/joe-simo/goblins-os@$image_digest" ]; then
                    docker buildx imagetools create \
                      --tag ghcr.io/joe-simo/goblins-os:stable \
                      "$previous_stable_ref" >/dev/null \
                      || echo "failed to restore the prior :stable alias" >&2
                  else
                    echo "refusing to overwrite a concurrently changed :stable alias" >&2
                  fi
                fi
              fi
              if [ "$transaction_draft_release" -eq 1 ] && [ -n "$release_id" ] && [ -n "$release_marker" ]; then
                current_release="$(mktemp "$RUNNER_TEMP/goblins-stable-rollback-release.XXXXXX")"
                if gh_write api "repos/$repository/releases/$release_id" > "$current_release" \
                  && [ "$(jq -er '.tag_name' "$current_release")" = "$STABLE_TAG" ] \
                  && [ "$(jq -er '.name' "$current_release")" = "Goblins OS $STABLE_TAG" ] \
                  && [ "$(jq -er '.body' "$current_release")" = "$(release_notes_body)" ]; then
                  if [ "$release_published" -eq 1 ]; then
                    gh_write api --method PATCH "repos/$repository/releases/$release_id" \
                      -F draft=true -F prerelease=false >/dev/null \
                      || echo "failed to return the release to draft during rollback" >&2
                  fi
                  if [ "$created_release" -eq 1 ] \
                    && [ "$(gh_write api "repos/$repository/releases/$release_id" --jq '.draft')" = true ]; then
                    gh_write api --method DELETE "repos/$repository/releases/$release_id" >/dev/null \
                      || echo "failed to delete the transaction draft" >&2
                    if [ "$(gh_write api "repos/$repository/git/ref/tags/$STABLE_TAG" --jq '.object.sha' 2>/dev/null)" = "$CANDIDATE_COMMIT" ]; then
                      gh_write api --method DELETE "repos/$repository/git/refs/tags/$STABLE_TAG" >/dev/null \
                        || echo "failed to delete the transaction tag" >&2
                    fi
                  fi
                else
                  echo "refusing rollback because the release identity changed" >&2
                fi
                rm -f -- "$current_release"
              fi
              set -e
            fi
            cleanup_credentials
            exit "$status"
          }
          trap publication_exit EXIT
