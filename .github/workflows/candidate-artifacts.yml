# Build and verify one exact ARM64 candidate, then export its OCI bytes for the
# separate protected publisher repository. This source workflow never logs in
# to GHCR, pushes an image, creates a tag, or creates a GitHub Release.
name: candidate-artifacts
run-name: candidate OCI handoff · ${{ inputs.candidate_commit }}

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact 40-hex current main commit to build without publishing
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_commit:
        description: Exact 40-hex current main commit to build without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-oci-handoff-${{ inputs.candidate_commit }}
  cancel-in-progress: false

env:
  CANDIDATE_COMMIT_INPUT: ${{ inputs.candidate_commit }}
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  candidate-artifacts:
    name: verified OCI handoff (aarch64)
    timeout-minutes: 240
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Validate the selected candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="${CANDIDATE_COMMIT_INPUT,,}"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || {
            echo "candidate_commit must be one full lowercase 40-hex Git commit." >&2
            exit 1
          }
          printf 'commit=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.candidate.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact clean source and native ARM64 runner
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          git fetch --no-tags --depth=1 origin main
          main_commit="$(git rev-parse FETCH_HEAD | tr '[:upper:]' '[:lower:]')"
          [[ "$main_commit" == "$CANDIDATE_COMMIT" ]] || {
            echo "Selected candidate $CANDIDATE_COMMIT is not current origin/main $main_commit." >&2
            exit 1
          }

      - name: Prepare the native release runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /usr/local/lib/node_modules \
            /usr/share/miniconda \
            /usr/lib/jvm \
            /usr/local/share/powershell
          sudo apt-get clean
          sudo docker image prune -af
          sudo swapoff -a || true
          sudo rm -f /mnt/goblins-os-candidate.swap
          sudo fallocate -l 16G /mnt/goblins-os-candidate.swap
          sudo chmod 600 /mnt/goblins-os-candidate.swap
          sudo mkswap /mnt/goblins-os-candidate.swap
          sudo swapon /mnt/goblins-os-candidate.swap
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep skopeo
          df -h /
          free -h

      - name: Verify the source repository has no publication authority
        shell: bash
        run: ./os/release/verify-publisher-boundary.sh

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build the native ARM64 OCI archive without publishing
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: os/bootc/Containerfile
          platforms: linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/goblins-os-aarch64.oci.tar
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ steps.candidate.outputs.commit }}
          cache-from: type=gha,scope=goblins-os-bootc-aarch64
          cache-to: type=gha,scope=goblins-os-bootc-aarch64,mode=max,ignore-error=true

      - name: Verify and load the exact OCI archive
        id: immutable
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          OCI_ARCHIVE: ${{ runner.temp }}/goblins-os-aarch64.oci.tar
        run: |
          set -euo pipefail
          umask 077
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -s "$OCI_ARCHIVE"
          test ! -L "$OCI_ARCHIVE"

          raw_manifest="$RUNNER_TEMP/goblins-os-aarch64.manifest.json"
          image_config="$RUNNER_TEMP/goblins-os-aarch64.config.json"
          skopeo inspect --raw "oci-archive:$OCI_ARCHIVE" > "$raw_manifest"
          actual_digest="sha256:$(sha256sum "$raw_manifest" | awk '{print $1}')"
          test "$actual_digest" = "$IMAGE_DIGEST"
          skopeo inspect --config "oci-archive:$OCI_ARCHIVE" > "$image_config"
          jq -e \
            --arg commit "$CANDIDATE_COMMIT" \
            '.architecture == "arm64"
             and .os == "linux"
             and .config.Labels["org.opencontainers.image.revision"] == $commit
             and .config.Labels["org.goblins-os.supported-architectures"] == "aarch64"' \
            "$image_config" >/dev/null
          jq -e \
            'if has("manifests") then
               (.manifests | length) == 1
               and .manifests[0].platform.os == "linux"
               and .manifests[0].platform.architecture == "arm64"
               and ([.manifests[] | select(.platform.architecture == "amd64")] | length) == 0
             else
               has("config") and has("layers")
             end' \
            "$raw_manifest" >/dev/null

          local_image="localhost/goblins-os:source-$CANDIDATE_COMMIT-aarch64"
          skopeo copy "oci-archive:$OCI_ARCHIVE" "docker-daemon:$local_image"
          test "$(docker image inspect --format '{{.Architecture}}' "$local_image")" = arm64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$local_image")" = "$CANDIDATE_COMMIT"
          test "$(docker image inspect --format '{{index .Config.Labels "org.goblins-os.supported-architectures"}}' "$local_image")" = aarch64

          intended_ref="ghcr.io/joe-simo/goblins-os@$IMAGE_DIGEST"
          printf 'digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'intended_ref=%s\n' "$intended_ref" >> "$GITHUB_OUTPUT"
          printf 'local_image=%s\n' "$local_image" >> "$GITHUB_OUTPUT"

      - name: Verify exact source and installed-root contracts
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.immutable.outputs.local_image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            "$LOCAL_IMAGE" \
            /usr/libexec/goblins-os/goblins-os-verify \
            --source-root /workspace \
            --source-profile update \
            | tee /tmp/goblins-candidate-source-verify.log
          grep -Eq '^goblins_os_verify_result total=[0-9]+ blocked=0$' \
            /tmp/goblins-candidate-source-verify.log
          docker run --rm "$LOCAL_IMAGE" \
            /usr/libexec/goblins-os/goblins-os-verify --installed-root / \
            | tee /tmp/goblins-candidate-installed-verify.log
          grep -Eq '^goblins_os_verify_result total=[0-9]+ blocked=0$' \
            /tmp/goblins-candidate-installed-verify.log

      - name: Run the exact candidate install and services self-test
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.immutable.outputs.local_image }}
        run: |
          set -euo pipefail
          printf 'FROM %s AS goblins-os\n' "$LOCAL_IMAGE" \
            > /tmp/goblins-candidate-selftest.Dockerfile
          cat os/bootc/selftest.suffix.Dockerfile \
            >> /tmp/goblins-candidate-selftest.Dockerfile
          docker build \
            --file /tmp/goblins-candidate-selftest.Dockerfile \
            --target selftest \
            --tag localhost/goblins-os-selftest:source-aarch64 \
            .

      - name: Generate exact-candidate release evidence
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          INTENDED_IMAGE_REF: ${{ steps.immutable.outputs.intended_ref }}
          LOCAL_IMAGE: ${{ steps.immutable.outputs.local_image }}
        run: |
          set -euo pipefail
          evidence_dir="$PWD/os/signoff-proofs/sbom/aarch64"
          mkdir -p "$evidence_dir"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$evidence_dir:/out" \
            -w /workspace \
            "$LOCAL_IMAGE" \
            /usr/libexec/goblins-os/goblins-os-verify \
            --source-root /workspace \
            --release-evidence /out \
            --arch aarch64 \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --image-ref "$INTENDED_IMAGE_REF"
          . ./os/hardware-gate/rpm-sbom-arch.sh
          rpm_sbom_arch_matches "$evidence_dir/rpm-packages.tsv" aarch64
          . ./os/hardware-gate/release-evidence.sh
          goblins_os_release_evidence_hashes_match "$evidence_dir"

      - name: Seal and split the OCI publisher payload
        id: handoff
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          IMAGE_DIGEST: ${{ steps.immutable.outputs.digest }}
          INTENDED_IMAGE_REF: ${{ steps.immutable.outputs.intended_ref }}
          OCI_ARCHIVE: ${{ runner.temp }}/goblins-os-aarch64.oci.tar
        run: |
          set -euo pipefail
          umask 077
          handoff_dir="$PWD/artifacts/manifests/publisher-handoff/candidate/aarch64"
          parts_dir="$handoff_dir/parts"
          install -d -m 0700 "$parts_dir"

          archive_size="$(stat -c %s "$OCI_ARCHIVE")"
          test "$archive_size" -gt 0
          test "$archive_size" -le 34359738368
          archive_sha256="$(sha256sum "$OCI_ARCHIVE" | awk '{print $1}')"
          split -n 4 -d -a 2 \
            "$OCI_ARCHIVE" \
            "$parts_dir/goblins-os-aarch64.oci.tar.part-"
          test "$(find "$parts_dir" -maxdepth 1 -type f -name 'goblins-os-aarch64.oci.tar.part-*' | wc -l)" -eq 4
          for suffix in 00 01 02 03; do
            test -s "$parts_dir/goblins-os-aarch64.oci.tar.part-$suffix"
          done
          test "$(cat "$parts_dir"/goblins-os-aarch64.oci.tar.part-* | sha256sum | awk '{print $1}')" = "$archive_sha256"
          test "$(cat "$parts_dir"/goblins-os-aarch64.oci.tar.part-* | wc -c)" -eq "$archive_size"
          (
            cd "$handoff_dir"
            LC_ALL=C sha256sum parts/goblins-os-aarch64.oci.tar.part-* > SHA256SUMS
          )

          evidence_dir="$PWD/os/signoff-proofs/sbom/aarch64"
          evidence_manifest="$evidence_dir/release-evidence-manifest.json"
          evidence_manifest_sha256="$(sha256sum "$evidence_manifest" | awk '{print $1}')"
          cargo_packages_sha256="$(sha256sum "$evidence_dir/cargo-lock-packages.tsv" | awk '{print $1}')"
          rpm_command_sha256="$(sha256sum "$evidence_dir/rpm-packages.command" | awk '{print $1}')"
          rpm_packages_sha256="$(sha256sum "$evidence_dir/rpm-packages.tsv" | awk '{print $1}')"

          parts_json="$(
            cd "$handoff_dir"
            for suffix in 00 01 02 03; do
              part="parts/goblins-os-aarch64.oci.tar.part-$suffix"
              jq -n \
                --arg name "$part" \
                --arg sha256 "$(sha256sum "$part" | awk '{print $1}')" \
                --argjson size_bytes "$(stat -c %s "$part")" \
                '{name: $name, size_bytes: $size_bytes, sha256: $sha256}'
            done | jq -s .
          )"

          jq -n \
            --arg candidate_commit "$CANDIDATE_COMMIT" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg intended_ref "$INTENDED_IMAGE_REF" \
            --arg archive_sha256 "$archive_sha256" \
            --argjson archive_size "$archive_size" \
            --argjson parts "$parts_json" \
            --arg evidence_manifest_sha256 "$evidence_manifest_sha256" \
            --arg cargo_packages_sha256 "$cargo_packages_sha256" \
            --arg rpm_command_sha256 "$rpm_command_sha256" \
            --arg rpm_packages_sha256 "$rpm_packages_sha256" \
            --arg source_repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg source_ref "$GITHUB_REF" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflow_run_id "$GITHUB_RUN_ID" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema: "goblins-os-source-oci-handoff-v1",
              product: "Goblins OS",
              architecture: "aarch64",
              oci_architecture: "arm64",
              platform: "linux/arm64",
              candidate_commit: $candidate_commit,
              oci_revision: $candidate_commit,
              image_digest: $image_digest,
              intended_registry_repository: "ghcr.io/joe-simo/goblins-os",
              intended_immutable_image_ref: $intended_ref,
              oci_archive: {
                name: "goblins-os-aarch64.oci.tar",
                size_bytes: $archive_size,
                sha256: $archive_sha256,
                split_algorithm: "ordered-byte-concatenation-v1",
                parts: $parts
              },
              release_evidence: {
                schema: "goblins-os-release-evidence-v5",
                manifest_sha256: $evidence_manifest_sha256,
                cargo_packages_sha256: $cargo_packages_sha256,
                rpm_command_sha256: $rpm_command_sha256,
                rpm_packages_sha256: $rpm_packages_sha256
              },
              source_repository: $source_repository,
              source_ref: $source_ref,
              workflow_name: "candidate-artifacts",
              workflow_path: ".github/workflows/candidate-artifacts.yml",
              workflow_run: $workflow_run,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              exact_candidate_gates: {
                source_verifier: "pass",
                installed_root_verifier: "pass",
                services_selftest: "pass",
                native_runner: "aarch64"
              },
              required_publisher: {
                repository: "Joe-Simo/goblins-os-publisher",
                workflow: "publish-aarch64.yml",
                copy_mode: "preserve-digests"
              },
              source_repository_publish_authority: false,
              non_promotional: true
            }' > "$handoff_dir/handoff.json"

          jq -e \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg digest "$IMAGE_DIGEST" \
            --arg ref "$INTENDED_IMAGE_REF" \
            --arg archive_sha256 "$archive_sha256" \
            --argjson archive_size "$archive_size" \
            '.schema == "goblins-os-source-oci-handoff-v1"
             and .architecture == "aarch64"
             and .oci_architecture == "arm64"
             and .platform == "linux/arm64"
             and .candidate_commit == $commit
             and .oci_revision == $commit
             and .image_digest == $digest
             and .intended_immutable_image_ref == $ref
             and .oci_archive.sha256 == $archive_sha256
             and .oci_archive.size_bytes == $archive_size
             and (.oci_archive.parts | length) == 4
             and ([.oci_archive.parts[].name] | unique | length) == 4
             and .required_publisher.repository == "Joe-Simo/goblins-os-publisher"
             and .required_publisher.copy_mode == "preserve-digests"
             and .source_repository_publish_authority == false
             and .non_promotional == true' \
            "$handoff_dir/handoff.json" >/dev/null

          . ./os/hardware-gate/secret-scan.sh
          goblins_os_artifact_secret_scan "$PWD"
          rm -f -- "$OCI_ARCHIVE"
          printf 'handoff_dir=%s\n' "$handoff_dir" >> "$GITHUB_OUTPUT"

      - name: Upload OCI payload part 00
        id: part_00
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: goblins-os-source-oci-${{ steps.candidate.outputs.commit }}-aarch64-attempt-${{ github.run_attempt }}-part-00
          path: artifacts/manifests/publisher-handoff/candidate/aarch64/parts/goblins-os-aarch64.oci.tar.part-00
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload OCI payload part 01
        id: part_01
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: goblins-os-source-oci-${{ steps.candidate.outputs.commit }}-aarch64-attempt-${{ github.run_attempt }}-part-01
          path: artifacts/manifests/publisher-handoff/candidate/aarch64/parts/goblins-os-aarch64.oci.tar.part-01
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload OCI payload part 02
        id: part_02
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: goblins-os-source-oci-${{ steps.candidate.outputs.commit }}-aarch64-attempt-${{ github.run_attempt }}-part-02
          path: artifacts/manifests/publisher-handoff/candidate/aarch64/parts/goblins-os-aarch64.oci.tar.part-02
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload OCI payload part 03
        id: part_03
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: goblins-os-source-oci-${{ steps.candidate.outputs.commit }}-aarch64-attempt-${{ github.run_attempt }}-part-03
          path: artifacts/manifests/publisher-handoff/candidate/aarch64/parts/goblins-os-aarch64.oci.tar.part-03
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Bind immutable Actions artifacts into the publisher envelope
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          PART_00_ID: ${{ steps.part_00.outputs.artifact-id }}
          PART_00_URL: ${{ steps.part_00.outputs.artifact-url }}
          PART_00_DIGEST: ${{ steps.part_00.outputs.artifact-digest }}
          PART_01_ID: ${{ steps.part_01.outputs.artifact-id }}
          PART_01_URL: ${{ steps.part_01.outputs.artifact-url }}
          PART_01_DIGEST: ${{ steps.part_01.outputs.artifact-digest }}
          PART_02_ID: ${{ steps.part_02.outputs.artifact-id }}
          PART_02_URL: ${{ steps.part_02.outputs.artifact-url }}
          PART_02_DIGEST: ${{ steps.part_02.outputs.artifact-digest }}
          PART_03_ID: ${{ steps.part_03.outputs.artifact-id }}
          PART_03_URL: ${{ steps.part_03.outputs.artifact-url }}
          PART_03_DIGEST: ${{ steps.part_03.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          handoff_dir="$PWD/artifacts/manifests/publisher-handoff/candidate/aarch64"
          for digest in "$PART_00_DIGEST" "$PART_01_DIGEST" "$PART_02_DIGEST" "$PART_03_DIGEST"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          for artifact_id in "$PART_00_ID" "$PART_01_ID" "$PART_02_ID" "$PART_03_ID"; do
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          done
          handoff_sha256="$(sha256sum "$handoff_dir/handoff.json" | awk '{print $1}')"
          checksums_sha256="$(sha256sum "$handoff_dir/SHA256SUMS" | awk '{print $1}')"
          jq -n \
            --arg candidate_commit "$CANDIDATE_COMMIT" \
            --arg handoff_sha256 "$handoff_sha256" \
            --arg checksums_sha256 "$checksums_sha256" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflow_run_id "$GITHUB_RUN_ID" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg p0_name "goblins-os-source-oci-$CANDIDATE_COMMIT-aarch64-attempt-$GITHUB_RUN_ATTEMPT-part-00" \
            --arg p0_id "$PART_00_ID" --arg p0_url "$PART_00_URL" --arg p0_digest "$PART_00_DIGEST" \
            --arg p1_name "goblins-os-source-oci-$CANDIDATE_COMMIT-aarch64-attempt-$GITHUB_RUN_ATTEMPT-part-01" \
            --arg p1_id "$PART_01_ID" --arg p1_url "$PART_01_URL" --arg p1_digest "$PART_01_DIGEST" \
            --arg p2_name "goblins-os-source-oci-$CANDIDATE_COMMIT-aarch64-attempt-$GITHUB_RUN_ATTEMPT-part-02" \
            --arg p2_id "$PART_02_ID" --arg p2_url "$PART_02_URL" --arg p2_digest "$PART_02_DIGEST" \
            --arg p3_name "goblins-os-source-oci-$CANDIDATE_COMMIT-aarch64-attempt-$GITHUB_RUN_ATTEMPT-part-03" \
            --arg p3_id "$PART_03_ID" --arg p3_url "$PART_03_URL" --arg p3_digest "$PART_03_DIGEST" \
            '{
              schema: "goblins-os-actions-artifact-envelope-v1",
              payload_schema: "goblins-os-source-oci-handoff-v1",
              candidate_commit: $candidate_commit,
              architecture: "aarch64",
              handoff_sha256: $handoff_sha256,
              checksums_sha256: $checksums_sha256,
              workflow_run: $workflow_run,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              payload_artifacts: [
                {name: $p0_name, id: $p0_id, url: $p0_url, digest: ("sha256:" + $p0_digest)},
                {name: $p1_name, id: $p1_id, url: $p1_url, digest: ("sha256:" + $p1_digest)},
                {name: $p2_name, id: $p2_id, url: $p2_url, digest: ("sha256:" + $p2_digest)},
                {name: $p3_name, id: $p3_id, url: $p3_url, digest: ("sha256:" + $p3_digest)}
              ],
              required_publisher_repository: "Joe-Simo/goblins-os-publisher",
              source_repository_publish_authority: false,
              non_promotional: true
            }' > "$handoff_dir/publisher-envelope.json"
          jq -e \
            --arg commit "$CANDIDATE_COMMIT" \
            '.schema == "goblins-os-actions-artifact-envelope-v1"
             and .payload_schema == "goblins-os-source-oci-handoff-v1"
             and .candidate_commit == $commit
             and .architecture == "aarch64"
             and (.payload_artifacts | length) == 4
             and ([.payload_artifacts[].name] | unique | length) == 4
             and all(.payload_artifacts[]; (.digest | test("^sha256:[0-9a-f]{64}$")))
             and .required_publisher_repository == "Joe-Simo/goblins-os-publisher"
             and .source_repository_publish_authority == false
             and .non_promotional == true' \
            "$handoff_dir/publisher-envelope.json" >/dev/null
          . ./os/hardware-gate/secret-scan.sh
          goblins_os_artifact_secret_scan "$PWD"

      - name: Upload publisher metadata and release evidence
        id: metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: goblins-os-source-oci-${{ steps.candidate.outputs.commit }}-aarch64-attempt-${{ github.run_attempt }}-metadata
          path: |
            artifacts/manifests/publisher-handoff/candidate/aarch64/handoff.json
            artifacts/manifests/publisher-handoff/candidate/aarch64/publisher-envelope.json
            artifacts/manifests/publisher-handoff/candidate/aarch64/SHA256SUMS
            os/signoff-proofs/sbom/aarch64/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Summarize the non-promotional publisher handoff
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          IMAGE_DIGEST: ${{ steps.immutable.outputs.digest }}
          METADATA_URL: ${{ steps.metadata.outputs.artifact-url }}
          METADATA_DIGEST: ${{ steps.metadata.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$METADATA_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          {
            printf '### Verified ARM64 publisher handoff\n\n'
            printf -- '- Source commit: `%s`\n' "$CANDIDATE_COMMIT"
            printf -- '- OCI digest: `%s`\n' "$IMAGE_DIGEST"
            printf -- '- Metadata artifact: %s\n' "$METADATA_URL"
            printf -- '- Metadata artifact digest: `sha256:%s`\n' "$METADATA_DIGEST"
            printf -- '- Registry write, tag, release, and stable promotion: **not performed**\n'
            printf -- '- Required writer: `Joe-Simo/goblins-os-publisher`\n'
          } >> "$GITHUB_STEP_SUMMARY"
