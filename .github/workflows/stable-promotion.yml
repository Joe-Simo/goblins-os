                test "$(printf '%s\n' "$digests" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 || {
                  rm -f -- "$token_json" "$headers" "$body"
                  return 1
                }
                digest="$digests"
                [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                  rm -f -- "$token_json" "$headers" "$body"
                  return 1
