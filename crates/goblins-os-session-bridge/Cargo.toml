[package]
name = "goblins-os-session-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
goblins-os-textshortcuts-engine = { path = "../goblins-os-textshortcuts-engine" }
libc = "0.2"
rustix = { version = "1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
