# This source-side workflow creates an authenticated request for the separate
# protected publisher repository. It deliberately cannot push GHCR images,
# create or move Git tags, upload Release assets, or publish a GitHub Release.
name: aarch64-publisher-handoff
run-name: aarch64 publisher handoff · ${{ inputs.stable_tag }} · ${{ inputs.candidate_commit }}

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact lowercase 40-hex current origin/main candidate
        required: true
        type: string
      candidate_workflow_run_id:
        description: Exact successful candidate-artifacts run ID
        required: true
        type: string
      candidate_workflow_run_attempt:
        description: Exact successful candidate-artifacts run attempt
        required: true
        type: string
      branding_commit:
        description: Exact 40-hex source commit used for the reviewed branding-tool OCI
        required: true
        type: string
      branding_workflow_run_id:
        description: Exact successful branding-tool-image run ID
        required: true
        type: string
      branding_workflow_run_attempt:
        description: Exact successful branding-tool-image run attempt
        required: true
        type: string
      display_verification_run_id:
        description: Exact successful signed display-proof verification run ID
        required: true
        type: string
      display_verification_run_attempt:
        description: Exact signed display-proof verification run attempt
        required: true
        type: string
      stable_tag:
        description: Final SemVer tag such as v1.0.0, with no prerelease suffix
        required: true
        type: string
      confirmation:
        description: Exact text handoff-aarch64-stable TAG COMMIT
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: aarch64-publisher-handoff-${{ inputs.candidate_commit }}-${{ inputs.stable_tag }}
  cancel-in-progress: false

jobs:
  handoff:
    name: authenticate source artifacts and delegate publication
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable handoff identity
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_workflow_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_workflow_run_attempt }}
          BRANDING_COMMIT: ${{ inputs.branding_commit }}
          BRANDING_RUN_ID: ${{ inputs.branding_workflow_run_id }}
          BRANDING_RUN_ATTEMPT: ${{ inputs.branding_workflow_run_attempt }}
          DISPLAY_RUN_ID: ${{ inputs.display_verification_run_id }}
          DISPLAY_RUN_ATTEMPT: ${{ inputs.display_verification_run_attempt }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BRANDING_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          for value in \
            "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" \
            "$BRANDING_RUN_ID" "$BRANDING_RUN_ATTEMPT" \
            "$DISPLAY_RUN_ID" "$DISPLAY_RUN_ATTEMPT"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          [[ "$STABLE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$CONFIRMATION" = "handoff-aarch64-stable $STABLE_TAG $CANDIDATE_COMMIT"
          test "$GITHUB_REPOSITORY" = "Joe-Simo/goblins-os"
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_COMMIT"
          ./os/release/verify-publisher-boundary.sh

      - name: Authenticate exact source run and artifact metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/goblins-publisher-handoff-gh
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_workflow_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_workflow_run_attempt }}
          BRANDING_COMMIT: ${{ inputs.branding_commit }}
          BRANDING_RUN_ID: ${{ inputs.branding_workflow_run_id }}
          BRANDING_RUN_ATTEMPT: ${{ inputs.branding_workflow_run_attempt }}
          DISPLAY_RUN_ID: ${{ inputs.display_verification_run_id }}
          DISPLAY_RUN_ATTEMPT: ${{ inputs.display_verification_run_attempt }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          OUTPUT_DIR: ${{ runner.temp }}/goblins-publisher-handoff
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$OUTPUT_DIR"
          install -d -m 0700 "$OUTPUT_DIR" "$GH_CONFIG_DIR"

          fetch_run() {
            local run_id="$1"
            local attempt="$2"
            local expected_path="$3"
            local output="$4"
            local expected_commit="$5"
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt" \
              > "$output"
            jq -e \
              --arg commit "$expected_commit" \
              --arg path "$expected_path" \
              --argjson attempt "$attempt" \
              '.head_sha == $commit
               and .conclusion == "success"
               and .event == "workflow_dispatch"
               and .path == $path
               and .run_attempt == $attempt' \
              "$output" >/dev/null
          }

          select_artifact() {
            local inventory="$1"
            local name="$2"
            jq -c \
              --arg name "$name" \
              '[.artifacts[] | select(.name == $name and .expired == false)]
               | if length == 1 then .[0] else error("artifact identity mismatch: " + $name) end
               | select((.id | type) == "number" and .id > 0)
               | select((.size_in_bytes | type) == "number" and .size_in_bytes > 0)
               | select(.digest | test("^sha256:[0-9a-f]{64}$"))
               | {
                   name,
                   id,
                   digest,
                   size_in_bytes,
                   archive_download_url
                 }' \
              "$inventory"
          }

          fetch_run \
            "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" \
            ".github/workflows/candidate-artifacts.yml" \
            "$OUTPUT_DIR/candidate-run.json" \
            "$CANDIDATE_COMMIT"
          fetch_run \
            "$BRANDING_RUN_ID" "$BRANDING_RUN_ATTEMPT" \
            ".github/workflows/branding-tool-image.yml" \
            "$OUTPUT_DIR/branding-run.json" \
            "$BRANDING_COMMIT"
          fetch_run \
            "$DISPLAY_RUN_ID" "$DISPLAY_RUN_ATTEMPT" \
            ".github/workflows/aarch64-local-display-attestation.yml" \
            "$OUTPUT_DIR/display-run.json" \
            "$CANDIDATE_COMMIT"

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
            > "$OUTPUT_DIR/candidate-artifacts.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$BRANDING_RUN_ID/artifacts?per_page=100" \
            > "$OUTPUT_DIR/branding-artifacts.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$DISPLAY_RUN_ID/artifacts?per_page=100" \
            > "$OUTPUT_DIR/display-artifacts.json"

          : > "$OUTPUT_DIR/candidate-selected.jsonl"
          for suffix in 00 01 02 03; do
            select_artifact \
              "$OUTPUT_DIR/candidate-artifacts.json" \
              "goblins-os-source-oci-$CANDIDATE_COMMIT-aarch64-attempt-$CANDIDATE_RUN_ATTEMPT-part-$suffix" \
              >> "$OUTPUT_DIR/candidate-selected.jsonl"
          done
          select_artifact \
            "$OUTPUT_DIR/candidate-artifacts.json" \
            "goblins-os-source-oci-$CANDIDATE_COMMIT-aarch64-attempt-$CANDIDATE_RUN_ATTEMPT-metadata" \
            >> "$OUTPUT_DIR/candidate-selected.jsonl"
          jq -s . "$OUTPUT_DIR/candidate-selected.jsonl" \
            > "$OUTPUT_DIR/candidate-selected.json"

          : > "$OUTPUT_DIR/branding-selected.jsonl"
          for suffix in 00 01 02 03; do
            select_artifact \
              "$OUTPUT_DIR/branding-artifacts.json" \
              "goblins-os-branding-tool-oci-$BRANDING_COMMIT-aarch64-attempt-$BRANDING_RUN_ATTEMPT-part-$suffix" \
              >> "$OUTPUT_DIR/branding-selected.jsonl"
          done
          select_artifact \
            "$OUTPUT_DIR/branding-artifacts.json" \
            "goblins-os-branding-tool-oci-$BRANDING_COMMIT-aarch64-attempt-$BRANDING_RUN_ATTEMPT-metadata" \
            >> "$OUTPUT_DIR/branding-selected.jsonl"
          jq -s . "$OUTPUT_DIR/branding-selected.jsonl" \
            > "$OUTPUT_DIR/branding-selected.json"

          display_pattern="^aarch64-local-display-verified-$CANDIDATE_COMMIT-[0-9]{4}-[0-9]{2}-[0-9]{2}-attempt-$DISPLAY_RUN_ATTEMPT$"
          display_name="$(jq -er \
            --arg pattern "$display_pattern" \
            '[.artifacts[] | select((.name | test($pattern)) and .expired == false)]
             | if length == 1 then .[0].name else error("display artifact identity mismatch") end' \
            "$OUTPUT_DIR/display-artifacts.json")"
          select_artifact \
            "$OUTPUT_DIR/display-artifacts.json" \
            "$display_name" \
            > "$OUTPUT_DIR/display-selected.json"

          jq -n \
            --arg candidate_commit "$CANDIDATE_COMMIT" \
            --arg branding_commit "$BRANDING_COMMIT" \
            --arg stable_tag "$STABLE_TAG" \
            --arg source_repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg source_workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson source_workflow_run_id "$GITHUB_RUN_ID" \
            --argjson source_workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson candidate_run_id "$CANDIDATE_RUN_ID" \
            --argjson candidate_run_attempt "$CANDIDATE_RUN_ATTEMPT" \
            --argjson branding_run_id "$BRANDING_RUN_ID" \
            --argjson branding_run_attempt "$BRANDING_RUN_ATTEMPT" \
            --argjson display_run_id "$DISPLAY_RUN_ID" \
            --argjson display_run_attempt "$DISPLAY_RUN_ATTEMPT" \
            --slurpfile candidate_artifacts "$OUTPUT_DIR/candidate-selected.json" \
            --slurpfile branding_artifacts "$OUTPUT_DIR/branding-selected.json" \
            --slurpfile display_artifact "$OUTPUT_DIR/display-selected.json" \
            '{
              schema: "goblins-os-publisher-request-v1",
              product: "Goblins OS",
              architecture: "aarch64",
              oci_architecture: "arm64",
              candidate_commit: $candidate_commit,
              stable_tag: $stable_tag,
              source_repository: $source_repository,
              source_handoff: {
                workflow: ".github/workflows/stable-promotion.yml",
                run: $source_workflow_run,
                run_id: $source_workflow_run_id,
                run_attempt: $source_workflow_run_attempt
              },
              candidate_workflow: {
                path: ".github/workflows/candidate-artifacts.yml",
                run_id: $candidate_run_id,
                run_attempt: $candidate_run_attempt,
                artifacts: $candidate_artifacts[0]
              },
              branding_workflow: {
                path: ".github/workflows/branding-tool-image.yml",
                source_commit: $branding_commit,
                run_id: $branding_run_id,
                run_attempt: $branding_run_attempt,
                artifacts: $branding_artifacts[0]
              },
              display_verification_workflow: {
                path: ".github/workflows/aarch64-local-display-attestation.yml",
                run_id: $display_run_id,
                run_attempt: $display_run_attempt,
                artifact: $display_artifact[0]
              },
              target_publisher: {
                repository: "Joe-Simo/goblins-os-publisher",
                workflow: "publish-aarch64.yml",
                required_environment: "stable",
                required_architecture: "aarch64"
              },
              required_publisher_checks: [
                "authenticate-source-run-and-artifact-digests",
                "reassemble-and-hash-oci-archives",
                "inspect-single-linux-arm64-layouts",
                "copy-with-preserved-digests",
                "verify-public-registry-digests",
                "build-pinned-zstd-1.5.7-from-sha256-verified-source",
                "build-digest-bound-shippable-iso",
                "verify-authority2-display-proof",
                "run-shipping-status",
                "publish-allowlisted-release-bytes",
                "move-aarch64-and-stable-aliases-last"
              ],
              source_repository_publish_authority: false,
              non_promotional: true
            }' > "$OUTPUT_DIR/publisher-request.json"

          jq -e \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg branding_commit "$BRANDING_COMMIT" \
            --arg stable_tag "$STABLE_TAG" \
            '.schema == "goblins-os-publisher-request-v1"
             and .architecture == "aarch64"
             and .oci_architecture == "arm64"
             and .candidate_commit == $commit
             and .branding_workflow.source_commit == $branding_commit
             and .stable_tag == $stable_tag
             and (.candidate_workflow.artifacts | length) == 5
             and (.branding_workflow.artifacts | length) == 5
             and (.display_verification_workflow.artifact.digest | test("^sha256:[0-9a-f]{64}$"))
             and .target_publisher.repository == "Joe-Simo/goblins-os-publisher"
             and .target_publisher.required_environment == "stable"
             and .source_repository_publish_authority == false
             and .non_promotional == true' \
            "$OUTPUT_DIR/publisher-request.json" >/dev/null

          install -d -m 0700 \
            "$GITHUB_WORKSPACE/artifacts/manifests/publisher-handoff/request"
          install -m 0600 \
            "$OUTPUT_DIR/publisher-request.json" \
            "$GITHUB_WORKSPACE/artifacts/manifests/publisher-handoff/request/publisher-request.json"
          . "$GITHUB_WORKSPACE/os/hardware-gate/secret-scan.sh"
          goblins_os_artifact_secret_scan "$GITHUB_WORKSPACE"
          rm -f -- "$GH_CONFIG_DIR/hosts.yml"
          printf 'request=%s\n' \
            "$GITHUB_WORKSPACE/artifacts/manifests/publisher-handoff/request/publisher-request.json" \
            >> "$GITHUB_OUTPUT"

      - name: Upload the publisher request
        id: request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: goblins-os-publisher-request-${{ inputs.candidate_commit }}-${{ inputs.stable_tag }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.metadata.outputs.request }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Summarize the delegated publication request
        shell: bash
        env:
          REQUEST_URL: ${{ steps.request.outputs.artifact-url }}
          REQUEST_DIGEST: ${{ steps.request.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          {
            printf '### Stable publication delegated\n\n'
            printf -- '- Candidate: `%s`\n' '${{ inputs.candidate_commit }}'
            printf -- '- Requested tag: `%s`\n' '${{ inputs.stable_tag }}'
            printf -- '- Publisher request: %s\n' "$REQUEST_URL"
            printf -- '- Publisher request digest: `sha256:%s`\n' "$REQUEST_DIGEST"
            printf -- '- Required publisher repository: `Joe-Simo/goblins-os-publisher`\n'
            printf -- '- GHCR/package/tag/Release writes in this workflow: **none**\n'
          } >> "$GITHUB_STEP_SUMMARY"
