          snapshot_alias() {
            local alias="$1"
            local repository_ref tag token_json token headers body status digests digest actual
            repository_ref="${alias%:*}"
            tag="${alias##*:}"
            test "$repository_ref" = "ghcr.io/joe-simo/goblins-os"
            [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
            token_json="$(mktemp "$RUNNER_TEMP/goblins-stable-registry-token.XXXXXX")"
            headers="$(mktemp "$RUNNER_TEMP/goblins-stable-registry-headers.XXXXXX")"
            body="$(mktemp "$RUNNER_TEMP/goblins-stable-registry-body.XXXXXX")"
            if ! curl --fail --silent --show-error --get \
              --data-urlencode 'service=ghcr.io' \
              --data-urlencode 'scope=repository:joe-simo/goblins-os:pull' \
              https://ghcr.io/token > "$token_json"; then
              rm -f -- "$token_json" "$headers" "$body"
              return 1
            fi
            token="$(jq -er '.token | select(type == "string" and length > 0)' "$token_json")"
            status="$(curl --silent --show-error \
              --request GET \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "https://ghcr.io/v2/joe-simo/goblins-os/manifests/$tag")" || {
                rm -f -- "$token_json" "$headers" "$body"
                return 1
