              gh_write api --method POST "repos/$repository/releases" \
                -f "tag_name=$STABLE_TAG" \
                -f "target_commitish=$CANDIDATE_COMMIT" \
                -f "name=Goblins OS $STABLE_TAG" \
                -f "body=$(cat "$notes")" \
