              404)
                if ! jq -e '
                  (.errors | type == "array" and length >= 1)
                  and all(.errors[]; .code == "MANIFEST_UNKNOWN")
                ' "$body" >/dev/null; then
                  rm -f -- "$token_json" "$headers" "$body"
                  return 1
                fi
                rm -f -- "$token_json" "$headers" "$body"
                return 4
