[package]
name = "goblins-os-snapshot-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "goblins-os-snapshot-broker"
path = "src/main.rs"
required-features = ["linux-broker"]

[features]
default = []
linux-broker = []

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
libc = "0.2"
rustix = { version = "1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
