          assert_registry_arm_only() {
            local ref="$1"
            local expected_digest="$2"
            local raw formatted arm_child_digest child_ref child_raw child_config
            raw="$(mktemp "$RUNNER_TEMP/goblins-arm-manifest.XXXXXX")"
            formatted="$(mktemp "$RUNNER_TEMP/goblins-arm-inspect.XXXXXX")"
            docker buildx imagetools inspect --raw "$ref" > "$raw"
            docker buildx imagetools inspect "$ref" --format '{{json .}}' > "$formatted"
            test "sha256:$(sha256sum "$raw" | awk '{print $1}')" = "$expected_digest"
            arm_child_digest="$(python3 - "$raw" "$formatted" "$expected_digest" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              inspection = json.load(handle)
          expected_digest = sys.argv[3]
          if (inspection.get("manifest") or {}).get("digest") != expected_digest:
              raise SystemExit("registry inspection resolved a different immutable digest")
          annotations = manifest.get("annotations") if isinstance(manifest, dict) else None
          if manifest.get("artifactType") is not None or manifest.get("subject") is not None:
              raise SystemExit("registry object is an artifact, not a runnable image")
          if isinstance(annotations, dict) and any(
              key in {"vnd.docker.reference.type", "vnd.docker.reference.digest"}
              or value == "attestation-manifest"
              for key, value in annotations.items()
          ):
              raise SystemExit("registry object carries attestation-reference annotations")
          descriptors = manifest.get("manifests")
          if descriptors is None:
              if manifest.get("mediaType") not in (
                  "application/vnd.oci.image.manifest.v1+json",
                  "application/vnd.docker.distribution.manifest.v2+json",
              ):
                  raise SystemExit("registry returned an unsupported single-image manifest")
              image = inspection.get("image") or {}
              if image.get("architecture") != "arm64" or image.get("os") != "linux":
                  raise SystemExit("registry single-image manifest is not linux/arm64")
              print(expected_digest)
              raise SystemExit(0)
          if not isinstance(descriptors, list) or not descriptors:
              raise SystemExit("registry index has no manifests")
          if manifest.get("mediaType") not in (
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          ):
              raise SystemExit("registry returned an unsupported image index")
          arm_digests = set()
          image_manifest_types = {
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          }
          for descriptor in descriptors:
              if not isinstance(descriptor, dict):
                  raise SystemExit("registry index contains a malformed descriptor")
              digest = descriptor.get("digest")
              if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
                  raise SystemExit("registry index contains an invalid descriptor digest")
              if descriptor.get("mediaType") not in image_manifest_types:
                  raise SystemExit("registry index contains a non-image descriptor")
              descriptor_annotations = descriptor.get("annotations")
              if descriptor.get("artifactType") is not None or (
                  isinstance(descriptor_annotations, dict)
                  and any(
                      key in {"vnd.docker.reference.type", "vnd.docker.reference.digest"}
                      or value == "attestation-manifest"
                      for key, value in descriptor_annotations.items()
                  )
              ):
                  raise SystemExit("registry index contains an artifact descriptor")
              platform = descriptor.get("platform") or {}
              architecture = platform.get("architecture")
              if architecture == "arm64":
                  if platform.get("os") != "linux":
                      raise SystemExit("registry arm64 descriptor is not linux/arm64")
                  arm_digests.add(digest)
                  continue
              raise SystemExit(f"registry index contains non-ARM architecture: {architecture!r}")
          if len(arm_digests) != 1:
              raise SystemExit("registry index must contain exactly one linux/arm64 image")
          print(next(iter(arm_digests)))
          PY
            )"
            [[ "$arm_child_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            child_ref="${ref%@*}@$arm_child_digest"
            child_raw="$(mktemp "$RUNNER_TEMP/goblins-arm-child-manifest.XXXXXX")"
            child_config="$(mktemp "$RUNNER_TEMP/goblins-arm-child-config.XXXXXX")"
            docker buildx imagetools inspect --raw "$child_ref" > "$child_raw"
            test "sha256:$(sha256sum "$child_raw" | awk '{print $1}')" = "$arm_child_digest"
            docker buildx imagetools inspect "$child_ref" --format '{{json .Image}}' > "$child_config"
            python3 - "$child_raw" "$child_config" "$CANDIDATE_COMMIT" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              image = json.load(handle)
          candidate_commit = sys.argv[3]
          image_manifest_types = {
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          }
          image_config_types = {
              "application/vnd.oci.image.config.v1+json",
              "application/vnd.docker.container.image.v1+json",
          }
          runnable_layer_types = {
              "application/vnd.oci.image.layer.v1.tar",
              "application/vnd.oci.image.layer.v1.tar+gzip",
              "application/vnd.oci.image.layer.v1.tar+zstd",
              "application/vnd.oci.image.layer.nondistributable.v1.tar",
              "application/vnd.oci.image.layer.nondistributable.v1.tar+gzip",
              "application/vnd.oci.image.layer.nondistributable.v1.tar+zstd",
              "application/vnd.docker.image.rootfs.diff.tar",
              "application/vnd.docker.image.rootfs.diff.tar.gzip",
              "application/vnd.docker.image.rootfs.foreign.diff.tar.gzip",
          }
          config = manifest.get("config") if isinstance(manifest, dict) else None
          layers = manifest.get("layers") if isinstance(manifest, dict) else None
          annotations = manifest.get("annotations") if isinstance(manifest, dict) else None
          if (
              manifest.get("schemaVersion") != 2
              or manifest.get("mediaType") not in image_manifest_types
              or "manifests" in manifest
              or manifest.get("artifactType") is not None
              or manifest.get("subject") is not None
              or set(manifest) - {"schemaVersion", "mediaType", "config", "layers", "annotations"}
              or (
                  isinstance(annotations, dict)
                  and any(
                      key in {"vnd.docker.reference.type", "vnd.docker.reference.digest"}
                      or value == "attestation-manifest"
                      for key, value in annotations.items()
                  )
              )
              or not isinstance(config, dict)
              or config.get("mediaType") not in image_config_types
              or re.fullmatch(r"sha256:[0-9a-f]{64}", str(config.get("digest"))) is None
              or type(config.get("size")) is not int
              or config["size"] <= 0
              or not isinstance(layers, list)
              or not layers
          ):
              raise SystemExit("selected OCI child is not one runnable image manifest")
          for layer in layers:
              if (
                  not isinstance(layer, dict)
                  or layer.get("mediaType") not in runnable_layer_types
                  or re.fullmatch(r"sha256:[0-9a-f]{64}", str(layer.get("digest"))) is None
                  or type(layer.get("size")) is not int
                  or layer["size"] <= 0
              ):
                  raise SystemExit("selected OCI child has a malformed image layer")
          rootfs = image.get("rootfs") if isinstance(image, dict) else None
          diff_ids = rootfs.get("diff_ids") if isinstance(rootfs, dict) else None
          image_config = image.get("config") if isinstance(image, dict) else None
          labels = image_config.get("Labels") if isinstance(image_config, dict) else None
          if image.get("architecture") != "arm64" or image.get("os") != "linux":
              raise SystemExit("selected OCI child config is not linux/arm64")
          if (
              not isinstance(diff_ids, list)
              or len(diff_ids) != len(layers)
              or any(
                  re.fullmatch(r"sha256:[0-9a-f]{64}", str(diff_id)) is None
                  for diff_id in diff_ids
              )
          ):
              raise SystemExit("selected OCI child config has no exact runnable rootfs")
          if not isinstance(labels, dict):
              raise SystemExit("selected OCI child config has no image labels")
          if labels.get("org.opencontainers.image.revision") != candidate_commit:
              raise SystemExit("selected OCI child revision label does not match candidate")
          if labels.get("org.goblins-os.supported-architectures") != "aarch64":
              raise SystemExit("selected OCI child does not declare the ARM-only contract")
          PY
            rm -f -- "$raw" "$formatted" "$child_raw" "$child_config"
          }

          verify_draft_asset_subset() {
            local release_json="$1"
            local name path size digest id remote_size remote_digest remote_sha
            jq -e '
              (.assets | type == "array")
              and ([.assets[].name] | length == (unique | length))
            ' "$release_json" >/dev/null
            while IFS= read -r name; do
              [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]]
              path="$PAYLOAD_DIR/$name"
              test -f "$path"
              test ! -L "$path"
              size="$(wc -c < "$path" | tr -d ' ')"
              digest="$(sha256sum "$path" | awk '{print $1}')"
              id="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .id' "$release_json")"
              remote_size="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .size' "$release_json")"
              remote_digest="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .digest' "$release_json")"
              test "$remote_size" = "$size"
              test "$remote_digest" = "sha256:$digest"
              remote_sha="$(gh_write api -H 'Accept: application/octet-stream' \
                "repos/$repository/releases/assets/$id" | sha256sum | awk '{print $1}')"
              test "$remote_sha" = "$digest"
            done < <(jq -er '.assets[].name' "$release_json")
          }

          verify_release_assets() {
            local release_json="$1"
            local expected_count actual_count path name size digest id remote_size remote_digest remote_sha
            test "$(gh_write api "repos/$repository/git/ref/tags/$STABLE_TAG" --jq '.object.type')" = commit
            test "$(gh_write api "repos/$repository/git/ref/tags/$STABLE_TAG" --jq '.object.sha')" = "$CANDIDATE_COMMIT"
            expected_count="$(find "$PAYLOAD_DIR" -mindepth 1 -maxdepth 1 -type f -print | wc -l)"
            actual_count="$(jq -er '.assets | length' "$release_json")"
            test "$actual_count" -eq "$expected_count"
            while IFS= read -r path; do
              name="$(basename "$path")"
              size="$(wc -c < "$path" | tr -d ' ')"
              digest="$(sha256sum "$path" | awk '{print $1}')"
              id="$(jq -er --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else error("remote asset identity mismatch") end' "$release_json")"
              remote_size="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .size' "$release_json")"
              remote_digest="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .digest' "$release_json")"
              test "$remote_size" = "$size"
              test "$remote_digest" = "sha256:$digest"
              remote_sha="$(gh_write api -H 'Accept: application/octet-stream' \
                "repos/$repository/releases/assets/$id" | sha256sum | awk '{print $1}')"
              test "$remote_sha" = "$digest"
            done < <(find "$PAYLOAD_DIR" -mindepth 1 -maxdepth 1 -type f -print | sort)
            test "$(jq -er '.tag_name' "$release_json")" = "$STABLE_TAG"
          }

