            test "$(gh_write api "repos/$repository/git/ref/tags/$STABLE_TAG" --jq '.object.sha')" = "$CANDIDATE_COMMIT"
            test "$(jq -er '.prerelease' "$recovery_release")" = false
            test "$(jq -er '.tag_name' "$recovery_release")" = "$STABLE_TAG"
            test "$(jq -er '.name' "$recovery_release")" = "Goblins OS $STABLE_TAG"
            test "$(jq -er '.body' "$recovery_release")" = "$(cat "$notes")"
