# Compatibility entrypoint for producing the verified aarch64 OCI publisher
# handoff. Shippable media and every registry/tag/Release mutation belong to the
# separate protected publisher repository.
name: aarch64-candidate-oci-handoff
run-name: aarch64 candidate OCI handoff · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-artifacts:
    permissions:
      contents: read
    uses: ./.github/workflows/candidate-artifacts.yml
    with:
      candidate_commit: ${{ github.sha }}
