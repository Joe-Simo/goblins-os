# /usr/local is machine-local state on OSTree systems. Keep the reviewed
# desktop entry immutable under /usr, then refresh the higher-priority link at
# every boot so an upstream /usr/share entry cannot bypass the Goblins wrapper.
d /var/usrlocal/share 0755 root root -
d /var/usrlocal/share/applications 0755 root root -
L+ /var/usrlocal/share/applications/chatgpt.desktop - - - - /usr/lib/goblins-os/application-overrides/chatgpt.desktop
