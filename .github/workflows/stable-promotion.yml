          assert_main_head_or_published_resume
          current_aarch64_ref="$(snapshot_alias ghcr.io/joe-simo/goblins-os:aarch64)"
          test "$current_aarch64_ref" = "$previous_aarch64_ref" || {
            echo "The :aarch64 alias changed after the publication snapshot; refusing to overwrite it." >&2
            exit 1
          }
          if [ "$stable_alias_existed" -eq 1 ]; then
            current_stable_ref="$(snapshot_alias ghcr.io/joe-simo/goblins-os:stable)"
            test "$current_stable_ref" = "$previous_stable_ref" || {
              echo "The :stable alias changed after the publication snapshot; refusing to overwrite it." >&2
              exit 1
            }
          else
            if snapshot_alias ghcr.io/joe-simo/goblins-os:stable >/dev/null 2>&1; then
              echo "The :stable alias appeared after the publication snapshot; refusing to continue." >&2
              exit 1
            else
              stable_probe_status=$?
              test "$stable_probe_status" -eq 4
            fi
          fi
          aliases_mutated=1
          docker buildx imagetools create \
            --tag ghcr.io/joe-simo/goblins-os:aarch64 \
            "$image_ref"
          if [ "$stable_alias_existed" -eq 1 ]; then
            docker buildx imagetools create \
              --tag ghcr.io/joe-simo/goblins-os:stable \
              "$image_ref"
          fi
          assert_registry_arm_only ghcr.io/joe-simo/goblins-os:aarch64 "$image_digest"
          if [ "$stable_alias_existed" -eq 1 ]; then
            assert_registry_arm_only ghcr.io/joe-simo/goblins-os:stable "$image_digest"
          fi

          test "$(jq -er '.id' "$release_json")" = "$release_id"
          assert_main_head_or_published_resume
          if [ "$resume_published_release" -eq 0 ]; then
            gh_write api --method PATCH "repos/$repository/releases/$release_id" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true >/dev/null
            release_published=1
          else
            # The live recovery guard already proved this exact release is
            # non-draft and latest. Do not rewrite latest state on a resume.
            published_resume_is_current
          fi
          gh_write api "repos/$repository/releases/tags/$STABLE_TAG" > "$release_json"
          test "$(jq -er '.draft' "$release_json")" = false
          test "$(jq -er '.prerelease' "$release_json")" = false
          test "$(jq -er '.tag_name' "$release_json")" = "$STABLE_TAG"
          test "$(jq -er '.name' "$release_json")" = "Goblins OS $STABLE_TAG"
          test "$(jq -er '.body' "$release_json")" = "$(cat "$notes")"
          verify_release_assets "$release_json"
          test "$(gh_write api "repos/$repository/releases/latest" --jq '.id')" = "$release_id"
          assert_registry_arm_only ghcr.io/joe-simo/goblins-os:aarch64 "$image_digest"
          assert_main_head_or_published_resume
          if [ "$stable_alias_existed" -eq 0 ]; then
            # A registry tag that did not exist has no portable delete operation.
            # Make its creation the final, forward-resumable publication action.
            created_release=0
            transaction_draft_release=0
            aliases_mutated=0
            stable_created=0
            if current_stable_ref="$(snapshot_alias ghcr.io/joe-simo/goblins-os:stable 2>/dev/null)"; then
              test "$current_stable_ref" = "ghcr.io/joe-simo/goblins-os@$image_digest"
              assert_registry_arm_only ghcr.io/joe-simo/goblins-os:stable "$image_digest"
              stable_created=1
            else
              stable_probe_status=$?
              test "$stable_probe_status" -eq 4
              for attempt in 1 2 3; do
                if docker buildx imagetools create \
                  --tag ghcr.io/joe-simo/goblins-os:stable \
                  "$image_ref" \
                  && assert_registry_arm_only \
                    ghcr.io/joe-simo/goblins-os:stable "$image_digest"; then
                  stable_created=1
                  break
                fi
              done
            fi
            test "$stable_created" -eq 1
          else
            assert_registry_arm_only ghcr.io/joe-simo/goblins-os:stable "$image_digest"
          fi
          gh_write api "repos/$repository/releases/tags/$STABLE_TAG" > "$release_json"
          test "$(jq -er '.id' "$release_json")" = "$release_id"
          test "$(jq -er '.draft' "$release_json")" = false
          test "$(jq -er '.prerelease' "$release_json")" = false
          test "$(jq -er '.tag_name' "$release_json")" = "$STABLE_TAG"
          test "$(jq -er '.name' "$release_json")" = "Goblins OS $STABLE_TAG"
          test "$(jq -er '.body' "$release_json")" = "$(cat "$notes")"
          test "$(gh_write api "repos/$repository/releases/latest" --jq '.id')" = "$release_id"
          printf 'Published and verified %s\n' "$(jq -er '.html_url' "$release_json")"
          rm -f -- "$release_json" "$notes"
          cleanup_credentials
          trap - EXIT HUP INT TERM

      - name: Clean publication credentials
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/goblins-stable-docker
          GH_CONFIG_DIR: ${{ runner.temp }}/goblins-stable-gh-publish
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -f -- "$DOCKER_CONFIG/config.json" "$GH_CONFIG_DIR/hosts.yml"
